<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IMC Banner Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
// ── LANGUAGE GROUPS ───────────────────────────────────────────────────────────
// Maps CSV language values → canonical filename lang code
const LANG_GROUPS = {
  'NA':                        'EN',
  'UK (proofread)':            'EN',
  'AE (proofread)':            'EN',
  'IE (proofread)':            'EN',
  'AU WINTER 2026 (proofread)':'EN',
  'FR (proofread)':            'FR',
  'BEFR - (proofread)':        'FR',
  'ES (proofread)':            'ES',
  'DE (proofread)':            'DE',
  'PL (proofread)':            'PL',
  'NL (proofread)':            'NL',
  'BENL - (proofread)':        'NL',
};

// Get unique header langs — one per canonical code, first match wins
function getUniqueHeaderLangs() {
  if (!csvStore.hdr.length) return [];
  const keyCol = Object.keys(csvStore.hdr[0]).find(k=>k==='language'||k==='lang') || Object.keys(csvStore.hdr[0])[0];
  const seen = new Set();
  const result = [];
  for (const row of csvStore.hdr) {
    const rawLang = row[keyCol];
    const canon = LANG_GROUPS[rawLang] || cleanLang(rawLang);
    if (!seen.has(canon)) {
      seen.add(canon);
      result.push({ rawLang, canon, row });
    }
  }
  return result;
}

// Get all stats langs (one per row)
function getAllStatsLangs() {
  if (!csvStore.stats.length) return [];
  const keyCol = Object.keys(csvStore.stats[0]).find(k=>k==='language'||k==='lang') || Object.keys(csvStore.stats[0])[0];
  return csvStore.stats.map(row => ({
    rawLang: row[keyCol],
    canon: LANG_GROUPS[row[keyCol]] || cleanLang(row[keyCol]),
    row
  }));
}

function setProgress(msg) {
  const el = gi('batch-progress');
  el.style.display = 'block';
  el.textContent = msg;
}

function hideProgress() {
  gi('batch-progress').style.display = 'none';
}

// Apply a header CSV row to the banner fields
function applyHdrRow(row) {
  gi('t-line1').value = row.line1 || '';
  gi('t-line2').value = row.line2 || '';
  gi('t-line3').value = row.line3 || '';
  gi('t-line4').value = row.line4 || '';
  renderBanners();
}

// Apply a stats CSV row to the banner fields
function applyStatsRow(row) {
  gi('s-headline').value = row.headline || '';
  gi('s-n1').value = row.n1 || ''; gi('s-l1').value = row.l1 || '';
  gi('s-n2').value = row.n2 || ''; gi('s-l2').value = row.l2 || '';
  gi('s-n3').value = row.n3 || ''; gi('s-l3').value = row.l3 || '';
  gi('s-source').value = row.source || '';
  renderBanners();
}

async function captureCanvas(elId, w, h) {
  const el = gi(elId);
  const canvas = await html2canvas(el, {
    scale: 2, useCORS: true, allowTaint: true,
    backgroundColor: null, logging: false,
    width: el.offsetWidth, height: el.offsetHeight,
  });
  if (w && h && (w !== el.offsetWidth || h !== el.offsetHeight)) {
    const final = document.createElement('canvas');
    final.width = w; final.height = h;
    final.getContext('2d').drawImage(canvas, 0, 0, w, h);
    return final;
  }
  return canvas;
}

async function batchExportAll() {
  const hdrLangs = getUniqueHeaderLangs();
  const statsLangs = getAllStatsLangs();

  if (!hdrLangs.length && !statsLangs.length) {
    showToast('⚠ Load CSV files first', '#ff6b6b'); return;
  }

  const btn = gi('btn-batch-all');
  btn.textContent = 'Working...'; btn.classList.add('loading');

  const zip = new JSZip();
  const send = (gv('fn-send') || 'Send1').trim();
  const cat = CAT_CODES[gv('t-category')] || 'HGN';

  // Save current field values to restore later
  const snapshot = {};
  FIELD_IDS.forEach(id => { const el = gi(id); if(el) snapshot[id] = el.value; });

  let total = hdrLangs.length * 2 + statsLangs.length;
  let done = 0;

  // ── HEADER BANNERS ──────────────────────────────────────────────────────────
  for (const { rawLang, canon, row } of hdrLangs) {
    applyHdrRow(row);
    await new Promise(r => setTimeout(r, 120)); // let DOM settle

    setProgress(`Header ${canon} (${done+1}/${total})...`);

    // 600×300
    const c1 = await captureCanvas('preview-header');
    zip.file(`600x300-HeaderBanner-${cat}-${send}-${canon}.png`, c1.toDataURL('image/png').split(',')[1], {base64:true});
    done++;

    // 480×250
    setProgress(`Header ${canon} 480×250 (${done+1}/${total})...`);
    const c2 = await captureCanvas('preview-header', 480, 250);
    zip.file(`480x250-HeaderBanner-${cat}-${send}-${canon}.png`, c2.toDataURL('image/png').split(',')[1], {base64:true});
    done++;
  }

  // ── STATS BANNERS ───────────────────────────────────────────────────────────
  for (const { rawLang, canon, row } of statsLangs) {
    applyStatsRow(row);
    await new Promise(r => setTimeout(r, 120));

    const statsLang = LANG_GROUPS[rawLang] || cleanLang(rawLang);
    setProgress(`Stats ${statsLang} (${done+1}/${total})...`);

    const c3 = await captureCanvas('preview-stats', 480, 145);
    zip.file(`480x145-StatsBanner-${send}-${statsLang}.png`, c3.toDataURL('image/png').split(',')[1], {base64:true});
    done++;
  }

  // Restore original fields
  FIELD_IDS.forEach(id => { const el = gi(id); if(el && snapshot[id] !== undefined) el.value = snapshot[id]; });
  renderBanners();

  // Generate ZIP
  setProgress('Zipping files...');
  const blob = await zip.generateAsync({ type: 'blob' });
  const link = document.createElement('a');
  link.download = `imc-banners-${send}-${Date.now()}.zip`;
  link.href = URL.createObjectURL(blob);
  link.click();

  hideProgress();
  btn.textContent = '↓ Download All (ZIP)';
  btn.classList.remove('loading');
  showToast(`✓ ${done} banners exported`, '#4ade80');
}

</script>
</body>
</html>
